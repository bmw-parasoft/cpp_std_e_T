# This is a basic workflow to help you get started with the Run C/C++test action for Make-based project.
name: C/C++test with CMake

on:
  # Triggers the workflow on push or pull request events but only for the master (main) branch.
  push:
    branches: [ master, main, work-branch ]
  pull_request:
    branches: [ master, main, work-branch ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  run-cpptest-make:
    name: Analyze project with C/C++test Standard
        
    # Specifies required permissions for upload-sarif action
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: read

    # Specifies the type of runner that the job will run on.
    runs-on: self-hosted

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:

    # Checks out your repository under $GITHUB_WORKSPACE, so that your job can access it.
    - name: Checkout code
      uses: actions/checkout@v6
      with:
       fetch-depth: 0
      
    - name: Fetch all branch refs
      run: |
       git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
       echo "Current ref: $GITHUB_REF"
       echo "Remote branches:"
       git branch -r
       echo
       echo "All refs:"
       git for-each-ref --format="%(refname:short)" refs/remotes/origin/
       echo
       
    - name: Show branches visible to this job
      run: |
        echo "GITHUB_REF=$GITHUB_REF"
        echo "GITHUB_HEAD_REF=$GITHUB_HEAD_REF"
        echo "GITHUB_BASE_REF=$GITHUB_BASE_REF"
        echo
        echo "Local branches (git branch -vv):"
        git branch -vv || true
        echo
        echo "Remote-tracking branches (git branch -r):"
        git branch -r || true
        echo
        echo "All branches (git branch -a):"
        git branch -a || true
        echo
        echo "Remote heads from origin (git ls-remote --heads origin):"
        git ls-remote --heads origin || true
    
    # Configures your CMake project. Be sure the compile_commands.json file is created.
    - name: Configure project
      run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=1 -S . -B build

    # Builds your CMake project. (This step is optional, as it is not required for code analysis).
    - name: Build project (optional)
      run: cmake --build build

    # Runs code analysis with C/C++test.
    - name: Run C/C++test
      # Use the 'run-cpptest-action' GitHub action.
      uses: parasoft/run-cpptest-action@2.0.2
      # Optional parameters for 'run-cpptest-action'.
      with:
        # For CMake-based projects, use a compile_commands.json file as the input for analysis. 
        input: build/compile_commands.json
        compilerConfig: 'gcc_14-64'
        testConfig: 'dtp://conf_file_branch'
        # Uncomment if you are using C/C++test 2020.2 to generate a SARIF report:
        # reportFormat: xml,html,custom
        # additionalParams: '-property report.custom.extension=sarif -property report.custom.xsl.file=${PARASOFT_SARIF_XSL}'
      
    # Uploads analysis results in the SARIF format, so that they are displayed as GitHub code scanning alerts.
    #- name: Upload results (SARIF)
    #  if: always()
    #  uses: github/codeql-action/upload-sarif@v3
    #  with:
    #    sarif_file: reports/report.sarif
    
    # Uploads an archive that includes all report files (.xml, .html, .sarif).
    - name: Archive reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: CpptestReportsOG
        path: reports/*.*

    # Uploads an archive that includes all report files (.xml, .html, .sarif).
    - name: Archive reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: CpptestReports_for_2026.2
        path: reports/*.*
